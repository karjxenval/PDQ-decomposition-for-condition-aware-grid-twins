[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "condition-aware-grid-twins"
version = "1.0.0"
description = "Reproducible acquisition and real-data validation for condition-aware sparse-sensor full-field recovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "autograd>=1.6.2",
  "matplotlib>=3.8",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "pyarrow>=16",
  "Jinja2>=3.1",
]

[project.scripts]
dce-download = "dce_data.cli:main"

[tool.setuptools]
packages = ["dce_data"]
